[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "labhub-opt"
version = "0.1.0"
description = "Zero-dependency TB & HIV diagnostic hub planner: GeneXpert 4/16-module throughput & utilization, FEFO cartridge & reagent quantification, hub-and-spoke sputum courier turnaround SLA, and specimen cold-box viability."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "diagnostics",
    "tuberculosis",
    "genexpert",
    "laboratory-network",
    "public-health",
    "healthcare-logistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
labhub-opt = "labhub_opt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labhub_opt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
